<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<meta name="color-scheme" content="dark light">
<title>Edge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <main>
    <section id="view-pull" class="view" aria-label="Pull"></section>
    <section id="view-history" class="view" aria-label="History" hidden></section>
    <section id="view-settings" class="view" aria-label="Settings" hidden></section>
  </main>
  <nav id="tabs" aria-label="Main">
    <div class="inner" role="tablist">
      <button id="tab-pull" role="tab" aria-selected="true">Pull</button>
      <button id="tab-history" role="tab" aria-selected="false">History</button>
      <button id="tab-settings" role="tab" aria-selected="false">Settings</button>
    </div>
  </nav>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
